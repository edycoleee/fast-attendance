# ============================================================
# DATABASE SERVICE ONLY
# ============================================================
# PostgreSQL + pgAdmin for attendance face recognition system
# Usage: docker-compose up -d
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: attendance-db-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${DOCKER_HOST_IP:-0.0.0.0}:5432:5432"
    volumes:
      # Init script for first-time setup
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      # Persistent data storage
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sultan -d attendance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pg_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: attendance-db-pgadmin
    env_file:
      - ../.env
    environment:
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
    ports:
      - "${DOCKER_HOST_IP:-0.0.0.0}:5050:80"
    depends_on:
      - postgres
    networks:
      - pg_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  pg_network:
    name: pg_network
    driver: bridge